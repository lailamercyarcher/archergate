<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcherGate Experiment 001</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/compare.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="experiment">ArcherGate / Experiment 001</p>
      <h1>Computational montage</h1>
      <p class="summary" id="summary" role="status">Loading edit comparison…</p>
    </header>
    <div class="edits">
      <section id="edit-a" aria-labelledby="title-a">
        <h2 id="title-a">Edit A</h2>
        <video aria-label="Edit A with synthetic picture and sound" controls playsinline preload="auto" src="/video/edit-a.mp4"></video>
        <ol aria-label="Edit A cuts"></ol>
      </section>
      <section id="edit-b" aria-labelledby="title-b">
        <h2 id="title-b">Edit B</h2>
        <video aria-label="Edit B with synthetic picture and sound" controls playsinline preload="auto" src="/video/edit-b.mp4"></video>
        <ol aria-label="Edit B cuts"></ol>
      </section>
    </div>
    <p class="footnote">Source ranges are in frames at 24 fps. Each range excludes its end frame.</p>
  </main>
</body>
</html>
