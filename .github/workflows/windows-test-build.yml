name: Windows x64 development alpha

on:
  push:
    branches: [mission/004-editing-acceptance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workstation:
    if: github.ref == 'refs/heads/mission/004-editing-acceptance'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.2'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          architecture: x64
          package-manager-cache: false

      - name: Set up Windows Rust toolchain
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "archergate-$env:BUILD_ID"
          $logs = New-Item -ItemType Directory -Path "$build-logs"
          "ARCHERGATE_BUILD_DIR=$build" >> $env:GITHUB_ENV
          "ARCHERGATE_LOG_DIR=$($logs.FullName)" >> $env:GITHUB_ENV
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal *>&1 |
            Tee-Object -FilePath (Join-Path $logs.FullName 'rustup.log')
          if ($LASTEXITCODE -ne 0) { throw 'Rust MSVC setup failed.' }

      - name: Build and verify distribution
        shell: pwsh
        run: |
          $log = "$env:ARCHERGATE_LOG_DIR/build.log"
          try {
            ./scripts/build-workstation.ps1 -OutputDirectory $env:ARCHERGATE_BUILD_DIR -PythonExecutable (Get-Command python.exe).Source *>&1 |
              Tee-Object -FilePath $log
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $log
            throw
          }

      - name: Test editing, rendering and MCP on Windows
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:ARCHERGATE_FFMPEG = Join-Path $PWD 'src-tauri/payload/media-tools/ffmpeg.exe'
          $env:ARCHERGATE_FFPROBE = Join-Path $PWD 'src-tauri/payload/media-tools/ffprobe.exe'
          $env:ARCHERGATE_TEST_PYTHON = (Get-Command python.exe).Source
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'archergate-playwright'
          $env:PYTHONUTF8 = '1'
          $log = "$env:ARCHERGATE_LOG_DIR/regression.log"
          python -m pip install --only-binary=:all: -r requirements.lock *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Python test dependency setup failed.' }
          python -m pip check *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Python test dependency validation failed.' }
          python -m unittest discover -s tests/studio -v *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Studio Python regression failed.' }
          npm ci --ignore-scripts --no-audit --no-fund *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency setup failed.' }
          npx --no-install playwright install --only-shell chromium *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
          foreach ($test in @('browser.mjs', 'manual-editing.mjs')) {
            node "tests/studio/$test" *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "The Windows browser regression failed: $test" }
          }

      - name: Install and smoke test on Windows
        timeout-minutes: 12
        shell: pwsh
        run: |
          ./scripts/smoke-workstation.ps1 -BuildDirectory $env:ARCHERGATE_BUILD_DIR -DiagnosticsDirectory $env:ARCHERGATE_LOG_DIR *>&1 |
            Tee-Object -FilePath "$env:ARCHERGATE_LOG_DIR/smoke.log"
          Copy-Item -LiteralPath "$env:ARCHERGATE_LOG_DIR/smoke.json" -Destination "$env:ARCHERGATE_BUILD_DIR/distribution/"

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: archergate-win-x64-${{ github.sha }}-${{ env.BUILD_ID }}
          path: ${{ env.ARCHERGATE_BUILD_DIR }}/distribution/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: archergate-win-x64-logs-${{ github.sha }}-${{ env.BUILD_ID }}
          path: ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}-logs/
          retention-days: 14
