name: Windows x64 test build

on:
  push:
    branches: [test/media-correctness-harness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workstation:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.2'
          architecture: x64
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.5'
          architecture: x64
          package-manager-cache: false

      - name: Build and verify distribution
        id: build
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "archergate-$env:BUILD_ID"
          $logs = New-Item -ItemType Directory -Path "$build-logs"
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal *>&1 |
            Tee-Object -FilePath (Join-Path $logs.FullName 'rustup.log')
          if ($LASTEXITCODE -ne 0) { throw 'Rust MSVC setup failed.' }
          ./scripts/build-workstation.ps1 -OutputDirectory $build -PythonExecutable (Get-Command python.exe).Source *>&1 |
            Tee-Object -FilePath (Join-Path $logs.FullName 'build.log')

      - name: Smoke test on the Windows runner
        timeout-minutes: 10
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "archergate-$env:BUILD_ID"
          $setup = Get-ChildItem -LiteralPath (Join-Path $build 'distribution') -Filter '*-setup.exe' -File
          # The packaged offline installer also provisions WebView2 when the runner needs it.
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          "NSIS installer exit code $($install.ExitCode)" | Tee-Object -FilePath "$build-logs/install.log"
          if ($install.ExitCode -ne 0) { throw 'The test installer failed.' }
          ./scripts/smoke-workstation.ps1 -BuildDirectory $build -DiagnosticsDirectory "$build-logs" *>&1 |
            Tee-Object -FilePath "$build-logs/smoke.log"

      - name: Upload verified Windows packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: archergate-win-x64-${{ github.sha }}-${{ env.BUILD_ID }}
          path: |
            ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}/distribution/*.exe
            ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}/distribution/*.zip
            ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}/distribution/*.sha256
            ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}/distribution/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: archergate-win-x64-logs-${{ github.sha }}-${{ env.BUILD_ID }}
          path: ${{ runner.temp }}/archergate-${{ env.BUILD_ID }}-logs/
          retention-days: 14
